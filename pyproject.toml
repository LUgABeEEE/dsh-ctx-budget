[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-ctx-budget"
version = "0.1.0"
description = "Audit and trim the static context budget of an agent home: rules, memory, skills, tool surface, sessions and KB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsh-ctx-budget contributors" }]
keywords = ["context", "tokens", "agent", "memory", "skills", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
ctxbudget = "ctxbudget.cli:main"

[tool.setuptools]
packages = ["ctxbudget"]
